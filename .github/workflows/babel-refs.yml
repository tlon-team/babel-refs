# Copy as-is into .github/workflows/ of the babel-refs repo. The
# bibliography feeds every site, so a push to `production` rebuilds all of
# them; sites whose deployed babel-refs commit is already current skip.
name: Build sites

on:
  push:
    branches: [production]

permissions: {}

concurrency:
  group: builds
  cancel-in-progress: false

jobs:
  build:
    uses: tlon-team/site-builds/.github/workflows/build-uqbar-sites.yml@main
    with:
      skip_if_content_unchanged: true
